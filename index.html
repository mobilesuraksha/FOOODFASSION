<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F-Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>body{font-family:'Outfit',sans-serif;background:#f8fafc;padding-bottom:100px;} .glass{background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);}</style>
</head>
<body class="text-slate-800">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
    </script>

    <div id="authModal" class="fixed inset-0 bg-slate-900/90 z-[999] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8 text-center">
            <h2 class="text-2xl font-black mb-2">Welcome</h2>
            <p class="text-slate-400 text-sm mb-6">Login to order delicious food</p>
            <button onclick="googleLogin()" class="w-full bg-white border-2 border-slate-200 py-3 rounded-xl font-bold flex justify-center gap-2 hover:bg-slate-50">
                <i class="fab fa-google text-red-500"></i> Google Sign In
            </button>
        </div>
    </div>

    <header class="glass sticky top-0 z-40 px-5 py-3 flex justify-between items-center border-b border-slate-100">
        <div class="flex items-center gap-2">
            <div class="bg-orange-600 text-white w-8 h-8 rounded-lg flex items-center justify-center font-black">F</div>
            <h1 class="font-black italic text-lg">F-Store</h1>
        </div>
        <div class="relative p-2" onclick="openCart()">
            <i class="fas fa-shopping-basket text-2xl text-slate-700"></i>
            <span id="cartCount" class="absolute top-0 right-0 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
        </div>
    </header>

    <div class="p-4">
        <input id="search" oninput="render()" placeholder="Search Food..." class="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-100 font-bold mb-6 outline-none focus:ring-2 focus:ring-orange-100">
        
        <h3 class="font-bold text-lg mb-4">Menu</h3>
        <div id="grid" class="grid grid-cols-2 gap-4 pb-20">Loading...</div>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-slate-900/80 z-[100] hidden flex items-end justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-[2rem] p-6 max-h-[80vh] overflow-y-auto slide-up shadow-2xl">
            <h2 class="text-xl font-black mb-4">Your Cart</h2>
            <div id="cartList" class="space-y-2 mb-4"></div>
            
            <div class="border-t pt-4">
                <textarea id="addr" placeholder="Delivery Address..." class="w-full border-2 border-slate-100 p-3 rounded-xl mb-2 font-bold text-sm bg-slate-50 outline-none focus:border-orange-500"></textarea>
                <div class="flex justify-between items-center mt-4">
                    <div><span class="text-xs text-slate-400 font-bold">Total Pay</span><p class="text-2xl font-black" id="totalPrice">₹0</p></div>
                    <button onclick="placeOrder()" class="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold shadow-lg">ORDER</button>
                </div>
            </div>
            <button onclick="document.getElementById('cartModal').classList.add('hidden')" class="absolute top-4 right-4 bg-slate-100 w-8 h-8 rounded-full text-slate-500">✕</button>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('f_cart')) || [], products = [], user = null;

        auth.onAuthStateChanged(u => {
            if(u) { user = u; document.getElementById('authModal').classList.add('hidden'); init(); }
            else document.getElementById('authModal').classList.remove('hidden');
        });

        function googleLogin() { auth.signInWithPopup(provider).catch(e => alert(e.message)); }

        function init() {
            db.collection('products').onSnapshot(snap => {
                products = snap.docs.map(d => ({id: d.id, ...d.data()}));
                render();
            });
            updateCartUI();
        }

        function render() {
            let s = document.getElementById('search').value.toLowerCase();
            let list = products.filter(p => p.name.toLowerCase().includes(s));
            document.getElementById('grid').innerHTML = list.map(p => `
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 group">
                    <img src="${p.img}" class="w-full h-32 object-cover rounded-xl mb-3 bg-slate-50">
                    <h3 class="font-bold text-sm truncate">${p.name}</h3>
                    <div class="flex justify-between items-center mt-2 border-t pt-2 border-slate-50">
                        <span class="font-black text-orange-600">₹${p.price}</span>
                        <button onclick="add('${p.id}')" class="bg-slate-900 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold active:scale-90 transition">+</button>
                    </div>
                </div>
            `).join('');
        }

        function add(id) {
            let p = products.find(x => x.id == id);
            cart.push(p); localStorage.setItem('f_cart', JSON.stringify(cart)); updateCartUI();
            if(navigator.vibrate) navigator.vibrate(50);
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
        }

        function openCart() {
            if(!cart.length) return alert("Cart Empty");
            document.getElementById('cartModal').classList.remove('hidden');
            
            db.collection('settings').doc('global').get().then(doc => {
                let s = doc.data() || {base:20, surge:0};
                let fee = parseInt(s.base) + parseInt(s.surge);
                let itemTotal = cart.reduce((a,b)=>a+parseInt(b.price),0);
                
                document.getElementById('cartList').innerHTML = cart.map(i => `<div class="flex justify-between text-sm font-bold border-b border-slate-50 pb-2"><span>${i.name}</span><span>₹${i.price}</span></div>`).join('');
                document.getElementById('totalPrice').innerText = `₹${itemTotal + fee}`;
            });
        }

        function placeOrder() {
            let addr = document.getElementById('addr').value;
            if(!addr) return alert("Address Required");
            
            db.collection('settings').doc('global').get().then(doc => {
                let s = doc.data() || {base:20, surge:0};
                let fee = parseInt(s.base) + parseInt(s.surge);
                let itemTotal = cart.reduce((a,b)=>a+parseInt(b.price),0);

                db.collection('orders').add({
                    customerName: user.displayName,
                    customerPhone: user.email,
                    address: addr,
                    items: cart,
                    deliveryFee: fee,
                    total: itemTotal + fee,
                    status: 'Pending',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    date: new Date().toLocaleDateString()
                }).then(() => {
                    alert("Order Placed Successfully!");
                    cart = []; localStorage.removeItem('f_cart');
                    document.getElementById('cartModal').classList.add('hidden');
                    updateCartUI();
                });
            });
        }
    </script>
</body>
</html>
