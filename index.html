<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F-Store User</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; padding-bottom: 110px; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #ff6b00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
    </script>

    <div id="appLoader" class="fixed inset-0 bg-white z-[999] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <h2 class="font-bold text-slate-500 animate-pulse">Connecting to FoodHub...</h2>
    </div>

    <div id="authModal" class="fixed inset-0 bg-slate-900/95 z-[900] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8 text-center shadow-2xl">
            <div class="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🍔</div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">Welcome!</h2>
            <p class="text-slate-400 text-sm mb-8">Sign in to order fresh food</p>
            <button onclick="googleLogin()" class="w-full bg-white border-2 border-slate-200 text-slate-700 py-4 rounded-2xl font-bold shadow-sm hover:bg-slate-50 flex items-center justify-center gap-3 transition">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6"> Continue with Google
            </button>
        </div>
    </div>

    <header class="glass-header sticky top-0 z-40 px-5 py-3 flex justify-between items-center border-b border-slate-100">
        <div class="flex items-center gap-3">
            <div class="bg-orange-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-black italic shadow-lg">F</div>
            <div>
                <h1 class="text-lg font-black italic tracking-tighter text-slate-900 leading-none">F-Store</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest" id="welcomeMsg">Guest</p>
            </div>
        </div>
        <div class="relative cursor-pointer p-2" onclick="openCart()">
            <i class="fas fa-shopping-basket text-2xl text-slate-700"></i>
            <span id="cartCount" class="absolute top-0 right-0 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
        </div>
    </header>

    <div class="p-4">
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-4 text-gray-400"></i>
            <input id="search" oninput="renderProducts()" placeholder="Search items..." class="w-full bg-white pl-12 pr-4 py-4 rounded-2xl shadow-sm border border-slate-100 font-bold outline-none focus:ring-2 focus:ring-orange-100">
        </div>

        <div class="w-full h-48 bg-gradient-to-r from-slate-900 to-slate-800 rounded-[2rem] relative overflow-hidden mb-8 flex items-center justify-center text-center shadow-xl">
            <div class="relative z-10">
                <h2 class="text-3xl font-black text-white italic">FAST <span class="text-orange-500">DELIVERY</span></h2>
                <p class="text-slate-400 text-xs mt-1">Order now & get exciting offers</p>
            </div>
        </div>

        <h3 class="font-bold text-slate-800 text-lg mb-4 flex justify-between items-end">
            <span>Menu</span>
            <span class="text-xs text-slate-400 font-normal" id="itemCount">Loading...</span>
        </h3>
        <div id="productGrid" class="grid grid-cols-2 gap-4 pb-20"></div>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-slate-900/80 z-[100] hidden flex items-end justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full max-w-md rounded-[2rem] p-6 max-h-[85vh] overflow-y-auto slide-up shadow-2xl relative">
            <h2 class="text-2xl font-black mb-4">Your Cart</h2>
            
            <div id="cartList" class="space-y-3 mb-6 min-h-[50px]"></div>
            
            <div class="border-t border-dashed pt-4">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Delivery Address</p>
                <div class="relative">
                    <textarea id="cAddr" class="w-full border-2 border-slate-100 p-3 rounded-xl font-bold text-sm bg-slate-50 focus:bg-white focus:border-orange-500 outline-none transition" rows="2" placeholder="House No, Area, City..."></textarea>
                    <button onclick="getLocation()" class="absolute right-2 bottom-2 text-blue-500 text-xs font-bold bg-white px-2 py-1 rounded-lg shadow-sm border"><i class="fas fa-location-arrow"></i> GPS</button>
                </div>
                
                <div class="flex justify-between items-center mt-6">
                    <div>
                        <p class="text-xs font-bold text-slate-400">Total to Pay</p>
                        <p class="text-3xl font-black text-slate-800" id="totalPrice">₹0</p>
                    </div>
                    <button onclick="placeOrder()" class="bg-slate-900 text-white px-8 py-4 rounded-xl font-bold shadow-lg active:scale-95 transition">PLACE ORDER</button>
                </div>
            </div>
            <button onclick="document.getElementById('cartModal').classList.add('hidden')" class="absolute top-6 right-6 bg-slate-100 w-8 h-8 rounded-full text-slate-500 hover:bg-red-100 hover:text-red-500 transition">✕</button>
        </div>
    </div>

    <div class="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-100 p-3 flex justify-around z-40 pb-5">
        <a href="index.html" class="text-orange-600 flex flex-col items-center gap-1 transition transform hover:-translate-y-1"><i class="fas fa-home text-xl"></i><span class="text-[10px] font-bold">Home</span></a>
        <a href="admin.html" class="text-slate-400 hover:text-slate-800 flex flex-col items-center gap-1 transition transform hover:-translate-y-1"><i class="fas fa-user-shield text-xl"></i><span class="text-[10px] font-bold">Admin</span></a>
        <a href="delivery.html" class="text-slate-400 hover:text-slate-800 flex flex-col items-center gap-1 transition transform hover:-translate-y-1"><i class="fas fa-motorcycle text-xl"></i><span class="text-[10px] font-bold">Rider</span></a>
    </div>

    <script>
        let currentUser = null;
        let cart = JSON.parse(localStorage.getItem('f_cart_v2')) || [];
        let allProducts = [];
        let globalSettings = { base: 20, surge: 0 };

        // AUTH LISTENER
        auth.onAuthStateChanged(user => {
            document.getElementById('appLoader').style.display = 'none';
            if (user) {
                currentUser = user;
                document.getElementById('welcomeMsg').innerText = `Hi, ${user.displayName.split(' ')[0]}`;
                document.getElementById('authModal').classList.add('hidden');
                initApp();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
            }
        });

        function googleLogin() {
            auth.signInWithPopup(provider).catch(error => {
                alert("Login Failed: " + error.message);
            });
        }

        function initApp() {
            // Realtime Products Listener
            db.collection('products').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('itemCount').innerText = `${allProducts.length} Items`;
                renderProducts();
            });

            // Realtime Settings Listener
            db.collection('settings').doc('global').onSnapshot(doc => {
                if(doc.exists) globalSettings = doc.data();
            });
        }

        function renderProducts() {
            const s = document.getElementById('search').value.toLowerCase();
            const list = allProducts.filter(p => p.name.toLowerCase().includes(s));
            
            document.getElementById('productGrid').innerHTML = list.length ? list.map(p => `
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
                    <div class="h-32 w-full bg-slate-50 rounded-xl mb-3 overflow-hidden">
                        <img src="${p.img}" class="w-full h-full object-cover transition hover:scale-110 duration-500">
                    </div>
                    <h3 class="font-bold text-sm text-slate-800 truncate mb-1">${p.name}</h3>
                    <p class="text-[10px] text-slate-400 mb-auto">Delicious Item</p>
                    <div class="flex justify-between items-center mt-3 border-t border-slate-50 pt-2">
                        <span class="font-black text-orange-600">₹${p.price}</span>
                        <button onclick="addToCart('${p.id}')" class="bg-slate-900 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold shadow hover:bg-orange-600 transition active:scale-90">+</button>
                    </div>
                </div>
            `).join('') : '<p class="col-span-2 text-center text-slate-400 py-10">No items found</p>';
            
            document.getElementById('cartCount').innerText = cart.length;
        }

        function addToCart(id) {
            let p = allProducts.find(x => x.id == id);
            cart.push({...p, qty: 1}); 
            localStorage.setItem('f_cart_v2', JSON.stringify(cart));
            renderProducts();
            if(navigator.vibrate) navigator.vibrate(50);
        }

        function openCart() {
            if(!cart.length) return alert("Your cart is empty!");
            document.getElementById('cartModal').classList.remove('hidden');
            
            let itemTotal = cart.reduce((a,b) => a + (parseInt(b.price)||0), 0);
            let fee = parseInt(globalSettings.base || 20) + parseInt(globalSettings.surge || 0);
            
            document.getElementById('cartList').innerHTML = cart.map(i => 
                `<div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div class="flex items-center gap-3">
                        <img src="${i.img}" class="w-10 h-10 rounded-lg object-cover bg-white">
                        <span class="text-sm font-bold text-slate-700">${i.name}</span>
                    </div>
                    <span class="font-black text-slate-900">₹${i.price}</span>
                </div>`
            ).join('');
            
            document.getElementById('totalPrice').innerText = `₹${itemTotal + fee}`;
        }

        function placeOrder() {
            let addr = document.getElementById('cAddr').value;
            if(!addr) return alert("Please enter your delivery address!");

            let itemTotal = cart.reduce((a,b) => a + (parseInt(b.price)||0), 0);
            let fee = parseInt(globalSettings.base || 20) + parseInt(globalSettings.surge || 0);

            // Send to Firestore
            db.collection('orders').add({
                customerName: currentUser.displayName,
                customerEmail: currentUser.email,
                customerPhoto: currentUser.photoURL,
                address: addr,
                items: cart,
                itemTotal: itemTotal,
                deliveryFee: fee,
                total: itemTotal + fee,
                status: 'Pending',
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString(),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Order Placed Successfully! 🚀");
                cart = [];
                localStorage.removeItem('f_cart_v2');
                document.getElementById('cartModal').classList.add('hidden');
                renderProducts();
            }).catch(e => alert("Error: " + e.message));
        }

        function getLocation() {
            if (navigator.geolocation) {
                document.getElementById('cAddr').value = "Detecting...";
                navigator.geolocation.getCurrentPosition(position => {
                    const { latitude, longitude } = position.coords;
                    document.getElementById('cAddr').value = `GPS Location: ${latitude}, ${longitude}`;
                }, () => {
                    alert("Location access denied.");
                    document.getElementById('cAddr').value = "";
                });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }
    </script>
</body>
</html>
