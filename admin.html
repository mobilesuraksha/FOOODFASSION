<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin HQ | Firebase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; padding-bottom: 50px; }
        .glass { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .active-tab { background-color: #0f172a; color: white; box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.3); transform: translateY(-2px); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-border { animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-6">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <div id="login" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8 text-center shadow-2xl">
            <h2 class="text-3xl font-black mb-4">ADMIN ACCESS</h2>
            <input type="password" id="pin" placeholder="Enter PIN (1234)" class="w-full border-2 p-3 rounded-xl mb-4 font-bold text-center outline-none focus:border-orange-500">
            <button onclick="auth()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:scale-105 transition">UNLOCK</button>
        </div>
    </div>

    <div id="dash" class="hidden max-w-7xl mx-auto">
        <header class="flex flex-col xl:flex-row justify-between items-center mb-8 bg-white p-4 rounded-[2rem] shadow-sm">
            <h1 class="text-2xl font-black italic tracking-tight">F-Store <span class="text-orange-600">Admin</span></h1>
            <div class="flex gap-2 overflow-x-auto w-full xl:w-auto pb-2 xl:pb-0">
                <button onclick="view('ord')" id="btn-ord" class="px-5 py-2 rounded-xl font-bold text-xs active-tab">ORDERS</button>
                <button onclick="view('rid')" id="btn-rid" class="px-5 py-2 rounded-xl font-bold text-xs bg-white border">RIDERS</button>
                <button onclick="view('prod')" id="btn-prod" class="px-5 py-2 rounded-xl font-bold text-xs bg-white border">PRODUCTS</button>
                <button onclick="view('req')" id="btn-req" class="px-5 py-2 rounded-xl font-bold text-xs bg-white border">SHOPS</button>
                <button onclick="view('set')" id="btn-set" class="px-5 py-2 rounded-xl font-bold text-xs bg-white border">RATES</button>
            </div>
        </header>

        <div id="view-ord" class="fade-in">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-xl font-black">Live Orders</h2>
                <div class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1"><div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> Live Sync</div>
            </div>
            <div id="ordList" class="space-y-3">Loading...</div>
        </div>

        <div id="view-rid" class="hidden fade-in">
            <div class="grid lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-[2rem] h-fit border-l-8 border-blue-500">
                    <h3 class="font-bold mb-4">Add Rider</h3>
                    <input id="rName" placeholder="Name" class="w-full border p-2 rounded mb-2 font-bold text-sm">
                    <input id="rPhone" placeholder="Mobile" class="w-full border p-2 rounded mb-2 font-bold text-sm">
                    <input id="rPass" placeholder="Password" class="w-full border p-2 rounded mb-4 font-bold text-sm">
                    <button onclick="addRider()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Create Profile</button>
                </div>
                <div class="lg:col-span-2">
                    <h3 class="font-bold mb-4">Rider Performance (Live)</h3>
                    <div id="riderList" class="grid md:grid-cols-2 gap-4">Loading...</div>
                </div>
            </div>
        </div>

        <div id="view-prod" class="hidden fade-in">
            <div class="bg-white p-6 rounded-[2rem] mb-6 border-l-8 border-orange-500">
                <div class="flex justify-between mb-4">
                    <h3 class="font-bold text-lg" id="prodTitle">Add Product</h3>
                    <button onclick="resetForm()" class="text-xs text-slate-400 underline">Reset</button>
                </div>
                <input type="hidden" id="editId">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <input id="pName" placeholder="Name" class="border p-2 rounded font-bold text-sm">
                    <input id="pPrice" placeholder="Price" type="number" class="border p-2 rounded font-bold text-sm">
                    <input type="file" id="pFile" class="border p-2 rounded text-xs col-span-2">
                </div>
                <button onclick="saveProduct()" id="saveBtn" class="mt-4 w-full bg-slate-900 text-white py-3 rounded-xl font-bold">UPLOAD PRODUCT</button>
            </div>
            <div id="prodList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </div>

        <div id="view-req" class="hidden fade-in">
            <h2 class="font-bold mb-4">Pending Requests</h2>
            <div id="reqList" class="grid md:grid-cols-2 gap-4 mb-8"></div>
            <h2 class="font-bold mb-4">Active Shops</h2>
            <div id="shopList" class="grid md:grid-cols-3 gap-4"></div>
        </div>

        <div id="view-set" class="hidden fade-in">
            <div class="bg-white p-6 rounded-2xl max-w-md">
                <h3 class="font-bold mb-4">Delivery Fees</h3>
                <div class="flex gap-4 mb-4">
                    <input id="setBase" placeholder="Base ₹" class="border p-2 rounded w-1/2 font-bold">
                    <input id="setSurge" placeholder="Surge ₹" class="border p-2 rounded w-1/2 font-bold">
                </div>
                <button onclick="saveRates()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">UPDATE RATES</button>
            </div>
        </div>
    </div>

    <audio id="bell" src="https://assets.mixkit.co/active_storage/sfx/933/933-preview.mp3"></audio>

    <script>
        let lastCount = 0;
        function auth() { if(document.getElementById('pin').value=='1234'){ document.getElementById('login').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden'); init(); } else alert("Wrong PIN"); }
        function view(id) { document.querySelectorAll('[id^="view-"]').forEach(x=>x.classList.add('hidden')); document.getElementById('view-'+id).classList.remove('hidden'); }

        function init() {
            // 1. ORDERS
            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snap => {
                // New Order Alert
                let pending = snap.docs.filter(d=>d.data().status=='Pending').length;
                if(pending > lastCount) { document.getElementById('bell').play().catch(()=>{}); alert("New Order!"); }
                lastCount = pending;

                // Load Riders for Dropdown
                db.collection('riders').get().then(rSnap => {
                    let riders = rSnap.docs.map(r => ({id: r.id, ...r.data()}));
                    
                    document.getElementById('ordList').innerHTML = snap.docs.map(doc => {
                        let o = doc.data();
                        let riderOpts = riders.map(r => `<option value="${r.phone}">${r.name}</option>`).join('');
                        
                        // Action Buttons
                        let actions = '';
                        if(o.status == 'Pending') actions = `<button onclick="upd('${doc.id}','Accepted')" class="bg-green-500 text-white px-3 py-1 rounded text-xs font-bold shadow hover:scale-105 transition">ACCEPT</button>`;
                        else if(o.status == 'Accepted' || o.status == 'Preparing') actions = `<div class="flex gap-2"><select id="asn-${doc.id}" class="border rounded text-xs p-1"><option value="">Select Rider</option>${riderOpts}</select><button onclick="assign('${doc.id}')" class="bg-blue-600 text-white px-2 py-1 rounded text-xs font-bold">ASSIGN</button></div>`;
                        else actions = `<span class="bg-slate-100 px-2 py-1 rounded text-xs font-bold text-slate-500">${o.status}</span>`;

                        return `
                        <div class="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm ${o.status=='Pending'?'border-l-4 border-red-500':''}">
                            <div>
                                <p class="font-bold">#${doc.id.substr(0,5)} <span class="text-xs text-slate-400">${o.timestamp?.toDate().toLocaleTimeString()||''}</span></p>
                                <p class="text-sm text-slate-700 font-bold">${o.customerName}</p>
                                <p class="text-xs text-slate-500">${o.address}</p>
                                <div class="flex gap-3 text-xs font-bold mt-1"><span class="text-orange-600">Total: ₹${o.total}</span><span class="text-green-600">Fee: ₹${o.deliveryFee}</span></div>
                            </div>
                            <div class="text-right flex flex-col items-end gap-2">${actions} <button onclick="delDoc('orders','${doc.id}')" class="text-red-400 text-[10px] underline">Delete</button></div>
                        </div>`;
                    }).join('');
                });
            });

            // 2. RIDERS WITH STATS
            db.collection('riders').onSnapshot(snap => {
                const list = document.getElementById('riderList');
                list.innerHTML = '';
                snap.forEach(async (doc) => {
                    let r = doc.data();
                    // Calc Stats
                    let oSnap = await db.collection('orders').where('riderPhone', '==', r.phone).where('status', '==', 'Delivered').get();
                    let count = oSnap.size;
                    let earned = 0, cash = 0;
                    oSnap.forEach(o => { earned += parseInt(o.data().deliveryFee||0); cash += parseInt(o.data().total||0); });

                    let html = `
                    <div class="bg-white p-4 rounded-xl border shadow-sm">
                        <div class="flex justify-between items-center mb-2"><h4 class="font-bold">${r.name}</h4><span class="text-xs bg-slate-100 px-2 py-1 rounded">${r.phone}</span></div>
                        <div class="grid grid-cols-3 gap-2 text-center text-xs">
                            <div class="bg-blue-50 p-2 rounded"><b>${count}</b><br>Orders</div>
                            <div class="bg-green-50 p-2 rounded"><b>₹${earned}</b><br>Earned</div>
                            <div class="bg-orange-50 p-2 rounded"><b>₹${cash}</b><br>COD</div>
                        </div>
                        <button onclick="delDoc('riders','${doc.id}')" class="text-red-500 text-xs w-full mt-2">Remove Rider</button>
                    </div>`;
                    list.insertAdjacentHTML('beforeend', html);
                });
            });

            // 3. PRODUCTS
            db.collection('products').onSnapshot(snap => {
                document.getElementById('prodList').innerHTML = snap.docs.map(d => `
                    <div class="bg-white p-3 rounded-xl shadow-sm text-center relative group">
                        <img src="${d.data().img}" class="w-full h-24 object-cover rounded-lg mb-2 bg-slate-100">
                        <p class="font-bold text-xs truncate">${d.data().name}</p>
                        <p class="text-xs font-black text-orange-600">₹${d.data().price}</p>
                        <div class="absolute inset-0 bg-slate-900/80 rounded-xl flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition">
                            <button onclick="editP('${d.id}','${d.data().name}','${d.data().price}')" class="bg-blue-500 text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fas fa-edit"></i></button>
                            <button onclick="delDoc('products','${d.id}')" class="bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`).join('');
            });

            // 4. REQUESTS & SHOPS
            db.collection('shop_requests').onSnapshot(s => document.getElementById('reqList').innerHTML = s.docs.map(d => `<div class="bg-white p-3 rounded-lg border border-l-4 border-yellow-400"><p class="font-bold">${d.data().shopName}</p><p class="text-xs">${d.data().phone}</p><div class="flex gap-2 mt-2"><input id="pass-${d.id}" placeholder="Pass" class="border w-16 text-xs p-1"><button onclick="approve('${d.id}')" class="bg-green-500 text-white px-2 text-xs">✓</button></div></div>`).join(''));
            db.collection('shops').onSnapshot(s => document.getElementById('shopList').innerHTML = s.docs.map(d => `<div class="bg-slate-50 p-3 rounded border"><p class="font-bold">${d.data().shopName}</p><p class="text-xs">Pass: ${d.data().pass}</p><button onclick="delDoc('shops','${d.id}')" class="text-red-500 text-xs">Del</button></div>`).join(''));
            
            // RATES
            db.collection('settings').doc('global').get().then(d => { if(d.exists){ document.getElementById('setBase').value=d.data().base; document.getElementById('setSurge').value=d.data().surge; } });
        }

        // ACTIONS
        function upd(id,s){ db.collection('orders').doc(id).update({status:s}); }
        function assign(id){
            let p = document.getElementById(`asn-${id}`).value;
            if(!p) return alert("Select Rider");
            db.collection('riders').where('phone','==',p).get().then(s => {
                db.collection('orders').doc(id).update({status:'Out for Delivery', riderPhone:p, riderName:s.docs[0].data().name});
            });
        }
        function addRider(){
            let n=document.getElementById('rName').value, p=document.getElementById('rPhone').value, pa=document.getElementById('rPass').value;
            if(n && p) db.collection('riders').add({name:n, phone:p, pass:pa}).then(()=>alert("Added"));
        }
        function saveProduct() {
            let n=document.getElementById('pName').value, p=document.getElementById('pPrice').value, f=document.getElementById('pFile').files[0], eid=document.getElementById('editId').value;
            if(!n || !p) return alert("Fill details");
            
            if(f) {
                const reader = new FileReader(); reader.readAsDataURL(f);
                reader.onload = () => {
                    let data = {name:n, price:p, img:reader.result, timestamp: firebase.firestore.FieldValue.serverTimestamp()};
                    if(eid) db.collection('products').doc(eid).update(data);
                    else db.collection('products').add(data);
                    resetForm();
                }
            } else if(eid) {
                db.collection('products').doc(eid).update({name:n, price:p}); resetForm();
            } else alert("Select Image");
        }
        function editP(id,n,p){ document.getElementById('pName').value=n; document.getElementById('pPrice').value=p; document.getElementById('editId').value=id; document.getElementById('saveBtn').innerText="UPDATE"; document.getElementById('prodTitle').innerText="Edit Product"; }
        function resetForm(){ document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pFile').value=''; document.getElementById('editId').value=''; document.getElementById('saveBtn').innerText="UPLOAD PRODUCT"; document.getElementById('prodTitle').innerText="Add Product"; }
        
        function approve(id){
            let pass=document.getElementById(`pass-${id}`).value;
            if(!pass) return alert("Set Pass");
            db.collection('shop_requests').doc(id).get().then(d => {
                db.collection('shops').add({...d.data(), pass:pass});
                db.collection('shop_requests').doc(id).delete();
            });
        }
        function saveRates(){ db.collection('settings').doc('global').set({base:document.getElementById('setBase').value, surge:document.getElementById('setSurge').value}); alert("Saved"); }
        function delDoc(col,id){ if(confirm("Delete?")) db.collection(col).doc(id).delete(); }
    </script>
</body>
</html>
