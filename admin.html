<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; background: #f1f5f9; }</style>
</head>
<body class="p-6 text-slate-800">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <div id="login" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-2xl p-8 text-center shadow-2xl">
            <h2 class="text-2xl font-black mb-4">ADMIN ACCESS</h2>
            <input type="password" id="pin" placeholder="Enter PIN (1234)" class="w-full border-2 border-slate-200 p-3 rounded-xl mb-4 font-bold text-center outline-none focus:border-blue-500">
            <button onclick="auth()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:scale-105 transition">UNLOCK</button>
        </div>
    </div>

    <div id="dash" class="hidden max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black">Admin <span class="text-orange-600">Panel</span></h1>
            <div class="bg-white px-4 py-2 rounded-lg shadow-sm text-sm font-bold border">
                Status: <span class="text-green-500">● Online</span>
            </div>
        </header>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 h-fit">
                <h2 class="font-bold text-xl mb-4 flex items-center gap-2"><i class="fas fa-list"></i> Live Orders</h2>
                <div id="ordList" class="space-y-3">Loading...</div>
            </div>

            <div class="space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h2 class="font-bold text-lg mb-4 text-blue-600">Global Pricing</h2>
                    <div class="flex gap-4 mb-4">
                        <div class="w-1/2">
                            <label class="text-[10px] uppercase font-bold text-slate-400">Base Fee (₹)</label>
                            <input id="setBase" type="number" class="w-full border-2 p-2 rounded-xl font-bold outline-none focus:border-blue-500">
                        </div>
                        <div class="w-1/2">
                            <label class="text-[10px] uppercase font-bold text-slate-400">Surge (₹)</label>
                            <input id="setSurge" type="number" class="w-full border-2 p-2 rounded-xl font-bold outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <button onclick="saveRates()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">UPDATE RATES</button>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h2 class="font-bold text-lg mb-4 text-orange-600">Add New Product</h2>
                    <input id="pName" placeholder="Product Name" class="w-full border p-3 rounded-xl mb-3 text-sm font-bold bg-slate-50">
                    <input id="pPrice" placeholder="Price (₹)" type="number" class="w-full border p-3 rounded-xl mb-3 text-sm font-bold bg-slate-50">
                    
                    <div class="border-2 border-dashed border-slate-200 p-4 rounded-xl mb-4 text-center cursor-pointer hover:bg-slate-50 relative">
                        <p class="text-xs text-slate-400 font-bold">Click to Select Image</p>
                        <input type="file" id="pImgFile" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*">
                    </div>

                    <button onclick="uploadProduct()" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-orange-700 transition">UPLOAD TO MENU</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function auth() {
            if(document.getElementById('pin').value === '1234') { 
                document.getElementById('login').classList.add('hidden');
                document.getElementById('dash').classList.remove('hidden');
                initAdmin();
            } else alert("Wrong PIN");
        }

        function initAdmin() {
            // Load Orders (Realtime)
            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snap => {
                document.getElementById('ordList').innerHTML = snap.docs.map(doc => {
                    let o = doc.data();
                    let statusColor = o.status === 'Pending' ? 'bg-red-50 text-red-600 border-red-100' : 'bg-green-50 text-green-600 border-green-100';
                    let btn = o.status === 'Pending' ? `<button onclick="acceptOrder('${doc.id}')" class="bg-slate-900 text-white text-xs px-4 py-2 rounded-lg font-bold shadow hover:scale-105 transition">Accept</button>` : '';
                    
                    return `
                        <div class="border p-4 rounded-2xl flex justify-between items-center bg-slate-50/50">
                            <div>
                                <p class="font-bold text-slate-800">${o.customerName}</p>
                                <p class="text-xs text-slate-500 mb-1">${o.address}</p>
                                <span class="text-[10px] font-bold border px-2 py-1 rounded ${statusColor}">${o.status}</span>
                            </div>
                            <div class="text-right flex flex-col items-end gap-2">
                                <p class="font-black text-lg text-slate-800">₹${o.total}</p>
                                ${btn}
                            </div>
                        </div>
                    `;
                }).join('');
            });

            // Load Settings
            db.collection('settings').doc('global').get().then(doc => {
                if(doc.exists) {
                    document.getElementById('setBase').value = doc.data().base;
                    document.getElementById('setSurge').value = doc.data().surge;
                }
            });
        }

        function saveRates() {
            let base = document.getElementById('setBase').value;
            let surge = document.getElementById('setSurge').value;
            db.collection('settings').doc('global').set({ base: base, surge: surge })
                .then(() => alert("Rates Updated!"));
        }

        function uploadProduct() {
            let name = document.getElementById('pName').value;
            let price = document.getElementById('pPrice').value;
            let file = document.getElementById('pImgFile').files[0];

            if(!name || !price || !file) return alert("Fill all fields & Select Image");

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function() {
                db.collection('products').add({
                    name: name,
                    price: price,
                    img: reader.result, // Base64 Image
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert("Product Uploaded!");
                    document.getElementById('pName').value = '';
                    document.getElementById('pPrice').value = '';
                    document.getElementById('pImgFile').value = '';
                });
            };
        }

        function acceptOrder(id) {
            db.collection('orders').doc(id).update({ status: 'Accepted' });
        }
    </script>
</body>
</html>
