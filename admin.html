<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; padding-bottom: 50px; }
        .glass { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .active-tab { background-color: #0f172a; color: white; box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.3); transform: translateY(-2px); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-6">

    <div id="login" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8 text-center shadow-2xl">
            <h2 class="text-3xl font-black mb-6 uppercase tracking-tighter">Super Admin</h2>
            <p class="text-xs text-slate-400 mb-4">Default PIN: PASSWORD123</p>
            <input type="password" id="pin" placeholder="Enter Secret PIN" class="w-full bg-slate-50 border-2 border-slate-200 p-4 rounded-2xl text-center font-black text-lg outline-none mb-4 focus:border-orange-500 transition">
            <button onclick="auth()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl hover:scale-105 transition">UNLOCK SYSTEM</button>
        </div>
    </div>

    <div id="dash" class="hidden max-w-7xl mx-auto">
        
        <header class="flex flex-col xl:flex-row justify-between items-center mb-8 bg-white p-4 rounded-[2rem] shadow-sm border border-slate-200">
            <div class="flex items-center gap-4 mb-4 xl:mb-0">
                <div class="w-12 h-12 bg-orange-600 text-white rounded-2xl flex items-center justify-center font-bold text-2xl shadow-lg">A</div>
                <div>
                    <h1 class="text-2xl font-black italic tracking-tight">F-Store <span class="text-orange-600">HQ</span></h1>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Control Center</p>
                </div>
            </div>
            
            <div class="flex gap-2 overflow-x-auto w-full xl:w-auto pb-2 xl:pb-0 hide-scroll">
                <button onclick="view('ord')" id="btn-ord" class="px-6 py-3 rounded-xl font-bold text-xs whitespace-nowrap transition active-tab">LIVE ORDERS</button>
                <button onclick="view('rid')" id="btn-rid" class="px-6 py-3 rounded-xl font-bold text-xs whitespace-nowrap transition bg-white border hover:bg-slate-50">RIDERS</button>
                <button onclick="view('prod')" id="btn-prod" class="px-6 py-3 rounded-xl font-bold text-xs whitespace-nowrap transition bg-white border hover:bg-slate-50">PRODUCTS</button>
                <button onclick="view('req')" id="btn-req" class="px-6 py-3 rounded-xl font-bold text-xs whitespace-nowrap transition bg-white border hover:bg-slate-50">REQUESTS</button>
                <button onclick="view('set')" id="btn-set" class="px-6 py-3 rounded-xl font-bold text-xs whitespace-nowrap transition bg-white border hover:bg-slate-50">SETTINGS</button>
            </div>
        </header>

        <div id="view-ord" class="fade-in">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-2xl font-black text-slate-800">Order Management</h2>
                <div class="text-xs font-bold text-slate-400 flex gap-3">
                    <span class="flex items-center gap-1"><span class="w-3 h-3 bg-red-500 rounded-full"></span> Pending</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 bg-green-500 rounded-full"></span> Approved</span>
                </div>
            </div>
            <div id="ordList" class="space-y-4">
                <p class="text-center py-10 opacity-50">Connecting to Database...</p>
            </div>
        </div>

        <div id="view-rid" class="hidden fade-in">
            <div class="grid lg:grid-cols-3 gap-6">
                <div class="glass p-6 rounded-[2rem] border-l-8 border-blue-500 h-fit">
                    <h3 class="font-black text-lg mb-4 flex items-center gap-2"><i class="fas fa-motorcycle"></i> Add New Rider</h3>
                    <div class="space-y-3">
                        <input id="rName" placeholder="Full Name" class="w-full border p-3 rounded-xl text-sm font-bold bg-slate-50 outline-none">
                        <input id="rPhone" type="number" placeholder="Mobile Number" class="w-full border p-3 rounded-xl text-sm font-bold bg-slate-50 outline-none">
                        <input id="rPass" placeholder="Login Password" class="w-full border p-3 rounded-xl text-sm font-bold bg-slate-50 outline-none">
                        <button id="addRiderBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg">CREATE RIDER ACCOUNT</button>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <h3 class="font-black text-lg mb-4 text-slate-700">Rider Fleet</h3>
                    <div id="ridList" class="grid md:grid-cols-2 gap-4"></div>
                </div>
            </div>
        </div>

        <div id="view-prod" class="hidden fade-in">
            <div class="glass p-6 rounded-[2rem] mb-8 border-l-8 border-orange-500">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-black text-lg" id="formTitle">Add Product</h3>
                    <button onclick="resetProdForm()" class="text-xs text-slate-400 font-bold underline">Reset Form</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3">
                    <input id="pName" placeholder="Product Name" class="border p-3 rounded-xl text-sm font-bold bg-slate-50 outline-none">
                    <input id="pPrice" type="number" placeholder="Price (₹)" class="border p-3 rounded-xl text-sm font-bold bg-slate-50 outline-none">
                    <div class="border p-3 rounded-xl text-sm font-bold bg-slate-50 relative overflow-hidden group">
                        <p class="text-xs text-slate-400 mb-1">Image (File)</p>
                        <input type="file" id="pImgFile" accept="image/*" class="w-full text-xs">
                    </div>
                    <select id="pCat" class="border p-3 rounded-xl text-sm font-bold bg-slate-50 outline-none">
                        <option>Food</option><option>Fashion</option><option>Mobile</option>
                    </select>
                    <select id="pShop" class="border p-3 rounded-xl text-sm font-bold bg-slate-50 outline-none">
                        <option value="">Select Shop</option>
                    </select>
                </div>
                <button id="saveProdBtn" class="mt-4 w-full bg-slate-900 text-white py-4 rounded-xl font-black shadow-lg hover:bg-slate-800 transition">SAVE PRODUCT</button>
            </div>
            <div id="allProdList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </div>

        <div id="view-req" class="hidden fade-in">
            <h2 class="font-bold text-xl mb-4 text-slate-700">Pending Approvals</h2>
            <div id="reqList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <h2 class="font-bold text-xl mt-10 mb-4 text-slate-700">Active Shops</h2>
            <div id="shopList" class="grid md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>

        <div id="view-set" class="hidden fade-in">
            <div class="max-w-md mx-auto glass p-8 rounded-[2.5rem] shadow-2xl">
                <h2 class="text-2xl font-black mb-2 text-center">Global Rates</h2>
                <div class="space-y-6">
                    <div>
                        <label class="text-xs font-black text-slate-500 uppercase ml-1">Base Delivery Fee</label>
                        <input id="setBase" type="number" class="w-full bg-slate-50 border-2 border-slate-200 p-3 rounded-xl font-black text-xl text-slate-800 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-black text-red-500 uppercase ml-1">Surge Charge</label>
                        <input id="setSurge" type="number" class="w-full bg-red-50 border-2 border-red-100 p-3 rounded-xl font-black text-xl text-red-600 outline-none">
                    </div>
                    <button id="saveSettingsBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black shadow-lg">UPDATE RATES</button>
                </div>
            </div>
        </div>

    </div>

    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/933/933-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, onSnapshot, query, where, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- FIREBASE CONFIG (Must match Index.html) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- GLOBAL VARIABLES ---
        let orders = [], riders = [], shops = [], products = [], reqs = [];
        const alertAudio = document.getElementById('alertSound');
        let lastOrderCount = 0;

        // --- AUTH SYSTEM ---
        window.auth = () => {
            const pin = document.getElementById('pin').value;
            if(pin === 'PASSWORD123'){ 
                document.getElementById('login').classList.add('hidden'); 
                document.getElementById('dash').classList.remove('hidden'); 
                initListeners(); // Start receiving data only after login
            } else {
                alert("Wrong PIN"); 
            }
        };

        // --- DATA LISTENERS ---
        function initListeners() {
            console.log("Connecting to Firestore...");

            // 1. ORDERS LISTENER
            onSnapshot(collection(db, "orders"), (snap) => {
                orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                // Sort: Pending first, then by timestamp
                orders.sort((a,b) => {
                    if(a.status === 'Pending' && b.status !== 'Pending') return -1;
                    if(a.status !== 'Pending' && b.status === 'Pending') return 1;
                    return (b.timestamp || 0) - (a.timestamp || 0);
                });

                // Alert Sound for New Pending Orders
                let pendingCount = orders.filter(o => o.status === 'Pending').length;
                if(pendingCount > lastOrderCount) {
                    alertAudio.play().catch(e => console.log("Audio play failed"));
                }
                lastOrderCount = pendingCount;

                renderOrders();
            });

            // 2. RIDERS
            onSnapshot(collection(db, "riders"), (snap) => {
                riders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderRiders();
                renderOrders(); // Re-render orders to update dropdowns
            });

            // 3. SHOPS
            onSnapshot(collection(db, "shops"), (snap) => {
                shops = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderShops();
                // Update Shop Select in Products Form
                let sSelect = document.getElementById('pShop');
                sSelect.innerHTML = `<option value="">Select Shop</option>` + shops.map(s => `<option value="${s.id}">${s.shopName}</option>`).join('');
            });

            // 4. PRODUCTS & REQUESTS
            onSnapshot(collection(db, "products"), (snap) => {
                products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderProducts();
            });
            onSnapshot(collection(db, "shop_requests"), (snap) => {
                reqs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderReqs();
            });
        }

        // --- RENDER FUNCTIONS ---
        function renderOrders() {
            const container = document.getElementById('ordList');
            if(orders.length === 0) {
                container.innerHTML = '<div class="text-center py-10 opacity-50"><p>No orders found in Database</p></div>';
                return;
            }

            container.innerHTML = orders.map(o => {
                let sName = shops.find(s => s.id == o.shopId)?.shopName || 'Unknown Shop';
                let riderOpts = riders.map(r => `<option value="${r.phone}">${r.name}</option>`).join('');
                
                let cardColor = "border-l-4 border-slate-200"; // Default
                let actionUI = '';

                // --- STATUS LOGIC ---
                if(o.status === 'Pending') {
                    cardColor = "border-l-4 border-red-500 bg-red-50"; // Highlight Pending
                    actionUI = `
                        <div class="flex flex-col gap-2 w-full">
                            <p class="text-xs text-red-500 font-bold blink">Waiting for Approval</p>
                            <button onclick="window.approveOrder('${o.id}')" class="bg-red-600 text-white px-6 py-3 rounded-xl font-bold text-xs shadow-lg hover:bg-red-700 animate-pulse w-full">
                                ✓ APPROVE ORDER
                            </button>
                        </div>
                    `;
                } else if(o.status === 'Approved' || o.status === 'Preparing' || o.status === 'Accepted') {
                    cardColor = "border-l-4 border-green-500 bg-green-50"; // Highlight Ready/Approved
                    actionUI = `
                        <div class="flex flex-col gap-2 w-full">
                            <p class="text-xs text-green-600 font-bold">Approved. Assign Rider.</p>
                            <div class="flex gap-2">
                                <select id="asn-${o.id}" class="bg-white border p-3 rounded-xl text-xs font-bold outline-none w-full shadow-sm">
                                    <option value="">Select Rider...</option>
                                    ${riderOpts}
                                </select>
                                <button onclick="window.assignRider('${o.id}')" class="bg-slate-900 text-white px-4 rounded-xl text-xs font-bold hover:bg-slate-800 shadow-lg">
                                    ASSIGN
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    // Out for Delivery / Delivered
                    actionUI = `<span class="bg-slate-200 text-slate-600 px-3 py-2 rounded-lg text-xs font-bold block text-center w-full">${o.status} <br> <span class="text-[10px]">Rider: ${o.riderName||'-'}</span></span>`;
                }

                // Location Check
                let locBadge = (o.customer.lat && o.customer.lng) ? 
                    `<span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded font-bold"><i class="fas fa-location-arrow"></i> GPS</span>` : 
                    `<span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-bold">Addr Only</span>`;

                return `
                <div class="glass p-5 rounded-[1.5rem] flex flex-col md:flex-row justify-between items-start gap-4 ${cardColor}">
                    <div class="w-full">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-black text-xl text-slate-800">#${o.id.substr(0,5)}</span>
                            <span class="text-[10px] font-bold bg-white border px-2 py-1 rounded text-slate-400">${o.date}</span>
                        </div>
                        <p class="text-sm font-bold text-blue-600 mb-1"><i class="fas fa-store"></i> ${sName}</p>
                        
                        <div class="bg-white/50 p-2 rounded-lg mb-2">
                            <p class="text-sm font-bold text-slate-700 flex items-center gap-2">${o.customer.name} ${locBadge}</p>
                            <p class="text-xs text-slate-500">${o.customer.phone}</p>
                            <p class="text-xs text-slate-500 italic">${o.customer.addr}</p>
                        </div>

                        <div class="flex gap-4 text-xs font-black">
                            <span class="text-orange-600 bg-orange-50 px-2 py-1 rounded">COD: ₹${o.total}</span>
                        </div>
                    </div>
                    
                    <div class="w-full md:w-64 shrink-0">
                        ${actionUI}
                        <button onclick="window.delOrd('${o.id}')" class="text-red-400 text-[10px] font-bold hover:text-red-600 underline mt-2 w-full text-right">Delete</button>
                    </div>
                </div>`;
            }).join('');
        }

        function renderRiders() {
            document.getElementById('ridList').innerHTML = riders.map(r => `
                <div class="glass p-5 rounded-[1.5rem] relative overflow-hidden">
                    <div class="flex items-center gap-4 mb-2">
                        <div class="w-12 h-12 bg-slate-800 rounded-2xl flex items-center justify-center text-white font-bold text-xl">${r.name.charAt(0)}</div>
                        <div><h3 class="font-black text-slate-800 text-lg leading-none">${r.name}</h3><p class="text-xs text-slate-500 font-mono mt-1">${r.phone}</p></div>
                    </div>
                    <button onclick="window.delRid('${r.id}')" class="text-red-500 text-xs font-bold mt-2 hover:bg-red-50 px-3 py-1 rounded-lg transition">REMOVE RIDER</button>
                </div>`).join('');
        }

        // --- GLOBAL ACTIONS ---
        
        // 1. APPROVE ORDER (Pending -> Approved)
        window.approveOrder = async (oid) => {
            try {
                await updateDoc(doc(db, "orders", oid), { 
                    status: 'Approved' // Matches what Shop app sees to start cooking
                });
            } catch(e) { console.error(e); alert("Error updating: " + e.message); }
        };

        // 2. ASSIGN RIDER (Approved -> Out for Delivery)
        window.assignRider = async (oid) => {
            let p = document.getElementById(`asn-${oid}`).value;
            if(!p) return alert("Please Select a Rider from the list");
            
            let r = riders.find(x => x.phone == p);
            
            try {
                await updateDoc(doc(db, "orders", oid), { 
                    status: 'Out for Delivery', 
                    riderPhone: p, 
                    riderName: r.name 
                });
                alert(`Assigned to ${r.name}`);
            } catch(e) { console.error(e); alert("Error assigning: " + e.message); }
        };

        // Other Actions
        window.delOrd = async (id) => { if(confirm("Delete Order?")) await deleteDoc(doc(db, "orders", id)); };
        window.delShop = async (id) => { if(confirm("Delete Shop?")) await deleteDoc(doc(db, "shops", id)); };
        window.delRid = async (id) => { if(confirm("Delete Rider?")) await deleteDoc(doc(db, "riders", id)); };
        
        // Add Rider
        document.getElementById('addRiderBtn').onclick = async () => {
            let n = document.getElementById('rName').value, p = document.getElementById('rPhone').value, ps = document.getElementById('rPass').value;
            if(n && p && ps) { 
                await addDoc(collection(db, "riders"), { name: n, phone: p, pass: ps }); 
                document.getElementById('rName').value=''; 
                alert("Rider Added"); 
            }
        };

        // View Switcher
        window.view = (v) => {
             ['ord','rid','prod','req','set'].forEach(x=>{ document.getElementById('view-'+x).classList.add('hidden'); document.getElementById('btn-'+x).className="px-6 py-3 rounded-xl font-bold text-xs whitespace-nowrap transition bg-white border hover:bg-slate-50 text-slate-500"; });
             document.getElementById('view-'+v).classList.remove('hidden');
             document.getElementById('btn-'+v).className = "px-6 py-3 rounded-xl font-bold text-xs whitespace-nowrap transition active-tab shadow-lg transform scale-105";
        }

        // Rendering helpers for other tabs
        function renderShops() { document.getElementById('shopList').innerHTML = shops.map(s => `<div class="glass p-4 rounded-[1.5rem] border relative"><h4 class="font-black text-slate-800">${s.shopName}</h4><p class="text-xs text-slate-500 font-bold">Pass: ${s.pass}</p><button onclick="window.delShop('${s.id}')" class="absolute top-4 right-4 text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button></div>`).join(''); }
        function renderProducts() { document.getElementById('allProdList').innerHTML = products.map(p => `<div class="glass p-3 rounded-2xl relative text-center"><p class="font-bold text-xs">${p.name}</p><p class="text-xs text-orange-600">₹${p.price}</p></div>`).join(''); }
        function renderReqs() { document.getElementById('reqList').innerHTML = reqs.map((r) => `<div class="glass p-5 rounded-[1.5rem] border-l-4 border-yellow-400"><h3 class="font-black text-lg text-slate-800">${r.shopName}</h3><div class="flex gap-2 mt-2"><input id="pass-${r.id}" placeholder="Set Pass" class="border p-1 w-20 text-xs"><button onclick="window.approveReq('${r.id}')" class="bg-green-500 text-white px-2 rounded text-xs">✓</button></div></div>`).join(''); }
        
        window.approveReq = async (rid) => {
            let r = reqs.find(x => x.id == rid);
            let pass = document.getElementById(`pass-${rid}`).value;
            if(!pass) return alert("Pass?");
            await addDoc(collection(db, "shops"), { ...r, pass: pass });
            await deleteDoc(doc(db, "shop_requests", rid));
        };
        
        // Product Saving
        document.getElementById('saveProdBtn').onclick = () => {
            let name = document.getElementById('pName').value, price = document.getElementById('pPrice').value, shopId = document.getElementById('pShop').value, cat = document.getElementById('pCat').value;
            let file = document.getElementById('pImgFile').files[0];
            if(!name || !file) return alert("Fill all");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function() {
                try { await addDoc(collection(db, "products"), { shopId, name, price, cat, img: reader.result }); alert("Saved"); } catch(e){alert("Img too big");}
            };
        };

    </script>
</body>
</html>
