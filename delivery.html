<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; padding-bottom: 20px; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Phase Colors */
        .phase-pickup { border-left: 4px solid #3b82f6; background: linear-gradient(90deg, rgba(59,130,246,0.1) 0%, rgba(15,23,42,0) 100%); }
        .phase-drop { border-left: 4px solid #22c55e; background: linear-gradient(90deg, rgba(34,197,94,0.1) 0%, rgba(15,23,42,0) 100%); }
        
        .nav-btn { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body class="p-4 md:p-6 select-none">

    <div id="login" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-6">
        <div class="text-center w-full max-w-sm">
            <div class="w-24 h-24 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl animate-bounce">🛵</div>
            <h2 class="text-3xl font-black mb-8 tracking-tighter">RIDER APP</h2>
            <input id="lPhone" type="number" placeholder="Mobile Number" class="w-full bg-slate-800 p-4 rounded-2xl mb-4 text-white font-bold outline-none border border-slate-700 focus:border-blue-500 transition">
            <input id="lPass" type="password" placeholder="Password" class="w-full bg-slate-800 p-4 rounded-2xl mb-6 text-white font-bold outline-none border border-slate-700 focus:border-blue-500 transition">
            <button id="loginBtn" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-black shadow-lg hover:scale-105 transition">START SHIFT</button>
            <p class="text-xs text-slate-500 mt-4">Ask Admin to create your account.</p>
        </div>
    </div>

    <div id="dash" class="hidden max-w-md mx-auto pb-24">
        
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-slate-600">
                    <i class="fas fa-helmet-safety text-yellow-400"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold leading-none" id="rName">Rider</h2>
                    <span class="text-[10px] text-green-400 font-bold uppercase tracking-wider flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Online</span>
                </div>
            </div>
            <button onclick="location.reload()" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-xl text-xs font-bold border border-red-500/20 hover:bg-red-500/20">LOGOUT</button>
        </div>

        <div class="glass p-6 rounded-[2rem] mb-6 relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-500/20 rounded-full blur-2xl"></div>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Total Earnings</p>
            <h1 class="text-5xl font-black text-white mb-2 tracking-tight" id="totalEarn">₹0</h1>
            <div class="flex gap-2">
                <span class="bg-slate-800 text-slate-300 px-3 py-1 rounded-lg text-[10px] font-bold border border-slate-700">Cash Collected: <span id="cashInHand" class="text-white">₹0</span></span>
            </div>
        </div>

        <h3 class="font-bold text-slate-400 mb-4 flex items-center gap-2"><i class="fas fa-map-marked-alt"></i> Current Missions</h3>
        <div id="taskList" class="space-y-5">
            <div class="text-center opacity-30 mt-10">
                <i class="fas fa-satellite-dish fa-spin text-4xl mb-2"></i>
                <p>Searching for orders...</p>
            </div>
        </div>
    </div>

    <audio id="bell" src="https://assets.mixkit.co/active_storage/sfx/933/933-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc, onSnapshot, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let me = null;
        let lastCount = 0;
        let allShops = []; 
        let currentLat = 0, currentLng = 0;

        // --- GET RIDER LIVE LOCATION (For Distance Calc) ---
        if(navigator.geolocation) {
            navigator.geolocation.watchPosition(p => {
                currentLat = p.coords.latitude;
                currentLng = p.coords.longitude;
            });
        }

        // --- DISTANCE CALCULATOR (Haversine) ---
        function getDist(lat1, lon1, lat2, lon2) {
            if(!lat1 || !lat2) return "?";
            const R = 6371; // km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1); // Returns KM
        }

        // --- VOICE ASSISTANT ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop previous
                let u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-IN'; // Indian English
                u.rate = 1;
                window.speechSynthesis.speak(u);
            }
        }

        // --- LOGIN LOGIC ---
        document.getElementById('loginBtn').onclick = async () => {
            let btn = document.getElementById('loginBtn');
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Checking...`;
            
            let p = document.getElementById('lPhone').value;
            let pass = document.getElementById('lPass').value;

            try {
                const q = query(collection(db, "riders"), where("phone", "==", p), where("pass", "==", pass));
                const snap = await getDocs(q);
                
                if(!snap.empty) {
                    me = { id: snap.docs[0].id, ...snap.docs[0].data() };
                    document.getElementById('login').classList.add('hidden');
                    document.getElementById('dash').classList.remove('hidden');
                    document.getElementById('rName').innerText = me.name;
                    speak(`Welcome ${me.name}. You are now online.`);
                    initApp();
                } else {
                    alert("Invalid Mobile or Password.");
                    btn.innerHTML = "START SHIFT";
                }
            } catch(e) {
                console.error(e);
                alert("Login Error");
                btn.innerHTML = "START SHIFT";
            }
        };

        function initApp() {
            onSnapshot(collection(db, "shops"), (snap) => {
                allShops = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            });
            startListening();
        }

        function startListening() {
            const q = query(collection(db, "orders"), where("riderPhone", "==", me.phone));
            
            onSnapshot(q, (snap) => {
                let orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                let activeCount = orders.filter(o => o.status !== 'Delivered').length;
                
                // --- NEW ORDER ALERT ---
                if(activeCount > lastCount) {
                    document.getElementById('bell').play().catch(()=>{});
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    
                    // Voice Alert Logic
                    let latest = orders.find(o => o.status === 'Out for Delivery');
                    if(latest) {
                        let shop = allShops.find(s => s.id == latest.shopId);
                        speak(`New Pickup assigned from ${shop ? shop.shopName : 'Shop'}`);
                    }
                }
                lastCount = activeCount;

                renderTasks(orders);
            });
        }

        function renderTasks(orders) {
            let active = orders.filter(o => o.status !== 'Delivered' && o.status !== 'Cancelled');
            let delivered = orders.filter(o => o.status === 'Delivered');

            let myEarnings = delivered.reduce((sum, o) => sum + (parseInt(o.deliveryFee) || 0), 0);
            let cashCollected = delivered.reduce((sum, o) => sum + (parseInt(o.total) || 0), 0);

            document.getElementById('totalEarn').innerText = `₹${myEarnings}`;
            document.getElementById('cashInHand').innerText = `₹${cashCollected}`;

            const list = document.getElementById('taskList');
            
            if(active.length === 0) {
                list.innerHTML = `<div class="text-center opacity-40 mt-12"><i class="fas fa-check-circle text-5xl mb-4 text-green-500"></i><p>No active orders</p></div>`;
                return;
            }

            list.innerHTML = active.map(o => {
                let shop = allShops.find(s => s.id == o.shopId) || { shopName: 'Shop', location: '' };

                // --- PHASE CHECK ---
                let isPickupPhase = (o.status === 'Out for Delivery');
                
                let targetName = isPickupPhase ? shop.shopName : o.customer.name;
                let targetAddr = isPickupPhase ? "Go to Shop for Pickup" : o.customer.addr;
                let cardClass = isPickupPhase ? "phase-pickup" : "phase-drop";
                let phaseLabel = isPickupPhase ? "STEP 1: PICKUP" : "STEP 2: DROP";
                let icon = isPickupPhase ? "fa-store" : "fa-user";
                let color = isPickupPhase ? "text-blue-400" : "text-green-400";
                
                // --- NAVIGATION & DISTANCE LOGIC ---
                let navUrl = '';
                let destLat = 0, destLng = 0;
                let distText = "";

                if(isPickupPhase) {
                    // Navigate to Shop
                    if(shop.location && shop.location.includes(',')) {
                        [destLat, destLng] = shop.location.split(',');
                        navUrl = `https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}&travelmode=two_wheeler`;
                        let km = getDist(currentLat, currentLng, destLat, destLng);
                        distText = `<span class="bg-slate-900 px-2 py-1 rounded text-xs font-bold text-white"><i class="fas fa-road"></i> ${km} km away</span>`;
                    } else {
                        navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.shopName + " Sonipat")}`;
                    }
                } else {
                    // Navigate to Customer
                    if (o.customer.lat && o.customer.lng) {
                        destLat = o.customer.lat;
                        destLng = o.customer.lng;
                        navUrl = `https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}&travelmode=two_wheeler`;
                        let km = getDist(currentLat, currentLng, destLat, destLng);
                        distText = `<span class="bg-slate-900 px-2 py-1 rounded text-xs font-bold text-white"><i class="fas fa-road"></i> ${km} km away</span>`;
                    } else {
                        navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.customer.addr)}`;
                    }
                }

                // Action Buttons
                let actionBtn = '';
                if(o.status === 'Out for Delivery') {
                    actionBtn = `<button onclick="window.upd('${o.id}','Picked Up', 'Pickup Complete. Now deliver to customer.')" class="w-full bg-blue-600 py-3 rounded-xl font-bold mt-3 shadow-lg hover:bg-blue-500 transition">CONFIRM PICKUP</button>`;
                } else if(o.status === 'Picked Up') {
                    actionBtn = `<button onclick="window.upd('${o.id}','Arrived', 'You have arrived.')" class="w-full bg-purple-600 py-3 rounded-xl font-bold mt-3 shadow-lg hover:bg-purple-500 transition">I'VE ARRIVED</button>`;
                } else if(o.status === 'Arrived') {
                    actionBtn = `<button onclick="window.upd('${o.id}','Delivered', 'Order Delivered Successfully.')" class="w-full bg-green-500 py-3 rounded-xl font-bold mt-3 shadow-lg animate-pulse hover:bg-green-400">COLLECT ₹${o.total} & FINISH</button>`;
                }

                return `
                <div class="glass p-5 rounded-[1.5rem] relative slide-up mb-4 ${cardClass}">
                    <div class="flex justify-between items-start mb-2">
                         <span class="text-[10px] font-bold bg-slate-800 px-2 py-1 rounded border border-slate-600 tracking-wider ${color}">${phaseLabel}</span>
                         ${distText}
                    </div>

                    <h3 class="font-black text-white text-2xl mb-1 flex items-center gap-2 mt-2"><i class="fas ${icon} text-lg opacity-50"></i> ${targetName}</h3>
                    <p class="text-sm text-slate-300 border-l-2 border-slate-500 pl-3 leading-snug mb-4">${targetAddr}</p>

                    <a href="${navUrl}" target="_blank" class="w-full bg-white text-slate-900 py-3.5 rounded-xl text-center text-sm font-black flex items-center justify-center gap-2 shadow-xl nav-btn mb-2">
                        <i class="fas fa-location-arrow text-blue-600"></i> START NAVIGATION (Fastest Route)
                    </a>
                    
                    ${!isPickupPhase ? `<a href="tel:${o.customer.phone}" class="block text-center text-xs font-bold text-slate-400 mb-2 underline">Call Customer</a>` : ''}

                    ${actionBtn}
                </div>`;
            }).join('');
        }

        window.upd = async (oid, status, speakMsg) => {
            if(status === 'Delivered') {
                if(!confirm("Cash Collected & Order Delivered?")) return;
            }

            // Speak Status Update
            speak(speakMsg);

            try {
                await updateDoc(doc(db, "orders", oid), { 
                    status: status,
                    timeline: arrayUnion({ status: status, msg: `Rider: ${status}`, time: new Date().toLocaleTimeString() }) 
                });
            } catch(e) { alert("Error: " + e.message); }
        };

    </script>
</body>
</html>
