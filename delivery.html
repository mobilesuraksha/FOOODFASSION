<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>body{font-family:'Outfit',sans-serif;background:#0f172a;color:white;}</style>
</head>
<body class="p-4">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <div id="login" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            <h2 class="text-3xl font-black mb-6 text-orange-500">RIDER APP</h2>
            <input id="lPhone" type="number" placeholder="Mobile" class="w-full bg-slate-800 p-4 rounded-xl mb-3 border border-slate-700 outline-none text-white">
            <input id="lPass" type="password" placeholder="Password" class="w-full bg-slate-800 p-4 rounded-xl mb-6 border border-slate-700 outline-none text-white">
            <button onclick="login()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold hover:scale-105 transition">START WORK</button>
        </div>
    </div>

    <div id="dash" class="hidden max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div><h1 class="text-2xl font-black" id="rName">Rider</h1><span class="text-xs text-green-400">● Online</span></div>
            <button onclick="location.reload()" class="bg-red-500/20 text-red-500 px-3 py-1 rounded text-xs font-bold">Logout</button>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl mb-6 border border-slate-700 shadow-lg">
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Total Earnings</p>
            <h2 class="text-4xl font-black mb-4 text-white" id="earn">₹0</h2>
            <div class="flex justify-between border-t border-slate-700 pt-4">
                <div><p class="text-xs text-slate-400 font-bold uppercase">Delivered</p><p class="font-bold text-xl" id="cnt">0</p></div>
                <div class="text-right"><p class="text-xs text-slate-400 font-bold uppercase">Cash (COD)</p><p class="font-bold text-xl text-green-400" id="cod">₹0</p></div>
            </div>
        </div>

        <h3 class="font-bold text-lg mb-4 text-slate-300">My Tasks</h3>
        <div id="tasks" class="space-y-4">Loading...</div>
    </div>

    <script>
        let me = null;

        function login() {
            let p = document.getElementById('lPhone').value, pass = document.getElementById('lPass').value;
            db.collection('riders').where('phone', '==', p).where('pass', '==', pass).get().then(snap => {
                if(!snap.empty) {
                    me = { id: snap.docs[0].id, ...snap.docs[0].data() };
                    document.getElementById('login').classList.add('hidden');
                    document.getElementById('dash').classList.remove('hidden');
                    document.getElementById('rName').innerText = me.name;
                    initRider();
                } else alert("Invalid Login");
            });
        }

        function initRider() {
            // LISTENER: Orders
            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snap => {
                let html = '', earn = 0, count = 0, cod = 0;
                
                snap.forEach(doc => {
                    let o = doc.data();
                    
                    // Filter: Only show orders related to THIS rider
                    if(o.riderPhone !== me.phone) return;

                    // STATS Logic
                    if(o.status == 'Delivered') {
                        earn += parseInt(o.deliveryFee || 0);
                        cod += parseInt(o.total || 0);
                        count++;
                        return; // Hide completed tasks from list
                    }

                    // ACTIVE TASKS Logic
                    let btn = '';
                    if(o.status == 'Out for Delivery') btn = `<button onclick="upd('${doc.id}','Picked Up')" class="w-full bg-blue-600 py-3 rounded-xl font-bold mt-2 shadow-lg">PICKUP ORDER</button>`;
                    else if(o.status == 'Picked Up') btn = `<button onclick="upd('${doc.id}','Delivered')" class="w-full bg-green-500 py-3 rounded-xl font-bold mt-2 shadow-lg animate-pulse">MARK DELIVERED</button>`;

                    html += `
                    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                        <div class="flex justify-between mb-2">
                            <h3 class="font-bold text-lg text-white">${o.customerName}</h3>
                            <span class="text-orange-400 font-bold">Earn ₹${o.deliveryFee}</span>
                        </div>
                        <p class="text-sm text-slate-400 mb-3 bg-slate-900 p-2 rounded">${o.address}</p>
                        <div class="flex gap-2 mb-3">
                            <a href="tel:${o.customerPhone||''}" class="bg-slate-700 px-3 py-1 rounded text-xs font-bold text-white">Call</a>
                            <a href="https://www.google.com/maps/search/?api=1&query=${o.address}" target="_blank" class="bg-slate-700 px-3 py-1 rounded text-xs font-bold text-blue-300">Map</a>
                        </div>
                        <div class="flex justify-between items-center text-xs font-bold">
                            <span class="bg-slate-700 px-2 py-1 rounded text-slate-300">COD: ₹${o.total}</span>
                            <span class="text-blue-400">${o.status}</span>
                        </div>
                        ${btn}
                    </div>`;
                });

                document.getElementById('tasks').innerHTML = html || '<p class="text-center text-slate-500 mt-10">No active tasks</p>';
                document.getElementById('earn').innerText = `₹${earn}`;
                document.getElementById('cnt').innerText = count;
                document.getElementById('cod').innerText = `₹${cod}`;
            });
        }

        function upd(id, s) { db.collection('orders').doc(id).update({status: s}); }
    </script>
</body>
</html>
