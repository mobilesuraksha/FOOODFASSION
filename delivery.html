<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; }</style>
</head>
<body class="p-4">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <div id="dash" class="max-w-md mx-auto">
        <h1 class="text-2xl font-black mb-6 text-orange-500">Rider Dashboard</h1>

        <div class="bg-slate-800 p-6 rounded-3xl mb-6 shadow-lg border border-slate-700">
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Total Earnings (Today)</p>
            <h2 class="text-5xl font-black mb-4 tracking-tighter" id="totalEarn">₹0</h2>
            <div class="flex justify-between border-t border-slate-700 pt-4">
                <div><p class="text-xs text-slate-400 font-bold uppercase">Delivered</p><p class="font-bold text-xl" id="delCount">0</p></div>
                <div class="text-right"><p class="text-xs text-slate-400 font-bold uppercase">Cash (COD)</p><p class="font-bold text-xl text-green-400" id="codTotal">₹0</p></div>
            </div>
        </div>

        <h3 class="font-bold text-lg mb-4 text-slate-300">Assigned Tasks</h3>
        <div id="taskList" class="space-y-4">Loading tasks...</div>
    </div>

    <script>
        // Init Rider Data Listeners
        // 1. ACTIVE ORDERS
        db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(snap => {
            let activeHtml = '';
            
            snap.forEach(doc => {
                let o = doc.data();
                let id = doc.id;
                
                // Show ONLY Accepted/Picked Up orders. Hide Pending or Delivered.
                if(o.status === 'Pending' || o.status === 'Delivered') return; 

                let btnAction = '';
                if(o.status === 'Accepted') 
                    btnAction = `<button onclick="updateStatus('${id}', 'Picked Up')" class="w-full bg-blue-600 py-3 rounded-xl font-bold mt-3 shadow-lg hover:bg-blue-500 transition">PICKUP ORDER</button>`;
                else if(o.status === 'Picked Up') 
                    btnAction = `<button onclick="updateStatus('${id}', 'Delivered')" class="w-full bg-green-500 py-3 rounded-xl font-bold mt-3 shadow-lg hover:bg-green-400 transition animate-pulse">MARK DELIVERED</button>`;

                activeHtml += `
                    <div class="bg-slate-800 p-5 rounded-[1.5rem] border border-slate-700 relative overflow-hidden">
                        <div class="flex justify-between mb-2 items-start">
                            <div>
                                <h3 class="font-bold text-lg text-white">${o.customerName}</h3>
                                <p class="text-sm text-slate-400">${o.address}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-orange-400 font-black text-lg block">₹${o.deliveryFee}</span>
                                <span class="text-[10px] text-slate-500 uppercase font-bold">Earning</span>
                            </div>
                        </div>
                        
                        <div class="flex gap-2 mt-4">
                            <span class="bg-slate-700/50 border border-slate-600 px-3 py-1 rounded-lg text-xs font-bold text-slate-300">COD: ₹${o.total}</span>
                            <span class="bg-blue-500/20 border border-blue-500/50 text-blue-300 px-3 py-1 rounded-lg text-xs font-bold">${o.status}</span>
                        </div>
                        ${btnAction}
                    </div>
                `;
            });

            document.getElementById('taskList').innerHTML = activeHtml || '<p class="text-slate-600 text-center py-10">No active deliveries</p>';
        });

        // 2. STATS (Completed Orders)
        db.collection('orders').where('status', '==', 'Delivered').onSnapshot(snap => {
            let earnings = 0;
            let count = 0;
            let cash = 0;
            
            snap.forEach(doc => {
                let d = doc.data();
                // In real app, filter by Date/RiderID here
                earnings += parseInt(d.deliveryFee || 0);
                cash += parseInt(d.total || 0);
                count++;
            });

            document.getElementById('totalEarn').innerText = `₹${earnings}`;
            document.getElementById('delCount').innerText = count;
            document.getElementById('codTotal').innerText = `₹${cash}`;
        });

        function updateStatus(id, status) {
            db.collection('orders').doc(id).update({ status: status });
        }
    </script>
</body>
</html>
