<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; padding-bottom: 20px; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Status Badges */
        .phase-pickup { border-left: 4px solid #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .phase-drop { border-left: 4px solid #22c55e; background: rgba(34, 197, 94, 0.1); }
    </style>
</head>
<body class="p-4 md:p-6 select-none">

    <div id="login" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-6">
        <div class="text-center w-full max-w-sm">
            <div class="w-24 h-24 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl">🛵</div>
            <h2 class="text-3xl font-black mb-8 tracking-tighter">RIDER APP</h2>
            <input id="lPhone" type="number" placeholder="Mobile Number" class="w-full bg-slate-800 p-4 rounded-2xl mb-4 text-white font-bold outline-none border border-slate-700 focus:border-blue-500 transition">
            <input id="lPass" type="password" placeholder="Password" class="w-full bg-slate-800 p-4 rounded-2xl mb-6 text-white font-bold outline-none border border-slate-700 focus:border-blue-500 transition">
            <button id="loginBtn" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-black shadow-lg hover:scale-105 transition">START SHIFT</button>
            <p class="text-xs text-slate-500 mt-4">Ask Admin to create your account.</p>
        </div>
    </div>

    <div id="dash" class="hidden max-w-md mx-auto pb-20">
        
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-slate-600">
                    <i class="fas fa-user text-slate-400"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold leading-none" id="rName">Rider</h2>
                    <span class="text-[10px] text-green-400 font-bold uppercase tracking-wider">● Online</span>
                </div>
            </div>
            <button onclick="location.reload()" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-xl text-xs font-bold border border-red-500/20 hover:bg-red-500/20">LOGOUT</button>
        </div>

        <div class="glass p-6 rounded-[2rem] mb-6 relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-500/20 rounded-full blur-2xl"></div>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Session Earnings</p>
            <h1 class="text-5xl font-black text-white mb-2 tracking-tight" id="totalEarn">₹0</h1>
            <div class="flex gap-2">
                <span class="bg-green-500/20 text-green-400 px-2 py-1 rounded text-[10px] font-bold">Cash in Hand: <span id="cashInHand">₹0</span></span>
            </div>
        </div>

        <h3 class="font-bold text-slate-400 mb-4 flex items-center gap-2"><i class="fas fa-list-ul"></i> Active Orders</h3>
        <div id="taskList" class="space-y-5">
            <div class="text-center opacity-30 mt-10">
                <i class="fas fa-spinner fa-spin text-4xl mb-2"></i>
                <p>Waiting for orders...</p>
            </div>
        </div>
    </div>

    <audio id="bell" src="https://assets.mixkit.co/active_storage/sfx/933/933-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc, onSnapshot, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let me = null;
        let lastCount = 0;
        let allShops = []; // To store shop locations
        let lastOrders = []; // To store orders for re-rendering

        // --- LOGIN LOGIC ---
        document.getElementById('loginBtn').onclick = async () => {
            let btn = document.getElementById('loginBtn');
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Checking...`;
            
            let p = document.getElementById('lPhone').value;
            let pass = document.getElementById('lPass').value;

            try {
                const q = query(collection(db, "riders"), where("phone", "==", p), where("pass", "==", pass));
                const snap = await getDocs(q);
                
                if(!snap.empty) {
                    me = { id: snap.docs[0].id, ...snap.docs[0].data() };
                    document.getElementById('login').classList.add('hidden');
                    document.getElementById('dash').classList.remove('hidden');
                    document.getElementById('rName').innerText = me.name;
                    initApp();
                } else {
                    alert("Invalid Mobile or Password. Ask Admin.");
                    btn.innerHTML = "START SHIFT";
                }
            } catch(e) {
                console.error(e);
                alert("Login Error: " + e.message);
                btn.innerHTML = "START SHIFT";
            }
        };

        function initApp() {
            // 1. Fetch All Shops (to get their locations)
            onSnapshot(collection(db, "shops"), (snap) => {
                allShops = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // If we already have orders, re-render to update shop details
                if(lastOrders.length > 0) renderTasks(lastOrders);
            });

            // 2. Start Listening for Orders
            startListening();
        }

        // --- LISTEN FOR ORDERS ---
        function startListening() {
            // Listen specifically for orders where 'riderPhone' matches logged-in rider
            const q = query(collection(db, "orders"), where("riderPhone", "==", me.phone));
            
            onSnapshot(q, (snap) => {
                let orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                lastOrders = orders; // Save for re-renders

                // Play Sound on New Order
                let activeCount = orders.filter(o => o.status !== 'Delivered').length;
                if(activeCount > lastCount) {
                    document.getElementById('bell').play().catch(()=>{});
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
                lastCount = activeCount;

                renderTasks(orders);
            });
        }

        // --- RENDER TASKS (DYNAMIC PHASE LOGIC) ---
        function renderTasks(orders) {
            // Sort: Active first
            let active = orders.filter(o => o.status !== 'Delivered' && o.status !== 'Cancelled');
            let delivered = orders.filter(o => o.status === 'Delivered');

            // Calculate Earnings
            let myEarnings = delivered.reduce((sum, o) => sum + (parseInt(o.deliveryFee) || 0), 0);
            let cashCollected = delivered.reduce((sum, o) => sum + (parseInt(o.total) || 0), 0);

            document.getElementById('totalEarn').innerText = `₹${myEarnings}`;
            document.getElementById('cashInHand').innerText = `₹${cashCollected}`;

            const list = document.getElementById('taskList');
            
            if(active.length === 0) {
                list.innerHTML = `<div class="text-center opacity-40 mt-12"><i class="fas fa-check-circle text-5xl mb-4 text-green-500"></i><p>All caught up!</p></div>`;
                return;
            }

            list.innerHTML = active.map(o => {
                // Find Shop Details
                let shop = allShops.find(s => s.id == o.shopId) || { shopName: 'Unknown Shop', location: '' };

                // --- PHASE LOGIC ---
                // Phase 1: Out for Delivery -> Target: SHOP
                // Phase 2: Picked Up -> Target: CUSTOMER
                let isPickupPhase = (o.status === 'Out for Delivery');
                
                let targetTitle = isPickupPhase ? "PICKUP FROM" : "DELIVER TO";
                let targetName = isPickupPhase ? shop.shopName : o.customer.name;
                let targetAddr = isPickupPhase ? "Go to Shop Location" : o.customer.addr;
                let cardClass = isPickupPhase ? "phase-pickup" : "phase-drop";
                let icon = isPickupPhase ? "fa-store" : "fa-user";
                
                // --- MAP LOGIC ---
                let mapUrl = '';
                let locBadge = '';

                if(isPickupPhase) {
                    // SHOP LOCATION MAP
                    // Assuming shop location is saved as "lat,lng" in Firestore from partner.html
                    if(shop.location && shop.location.includes(',')) {
                        mapUrl = `https://www.google.com/maps/search/?api=1&query=${shop.location}`;
                        locBadge = `<span class="bg-blue-500/20 text-blue-400 text-[10px] px-2 py-0.5 rounded font-bold">GPS: SHOP</span>`;
                    } else {
                        // Fallback to name search if no GPS
                        mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.shopName + " Sonipat")}`;
                        locBadge = `<span class="bg-slate-700 text-slate-400 text-[10px] px-2 py-0.5 rounded font-bold">MAP SEARCH</span>`;
                    }
                } else {
                    // CUSTOMER LOCATION MAP
                    if (o.customer.lat && o.customer.lng) {
                        mapUrl = `https://www.google.com/maps/search/?api=1&query=${o.customer.lat},${o.customer.lng}`;
                        locBadge = `<span class="bg-blue-500/20 text-blue-400 text-[10px] px-2 py-0.5 rounded font-bold">GPS: CUSTOMER</span>`;
                    } else {
                        mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.customer.addr)}`;
                        locBadge = `<span class="bg-slate-700 text-slate-400 text-[10px] px-2 py-0.5 rounded font-bold">TEXT ADDR</span>`;
                    }
                }

                // Dynamic Action Button
                let actionBtn = '';
                if(o.status === 'Out for Delivery') {
                    actionBtn = `<button onclick="window.upd('${o.id}','Picked Up')" class="w-full bg-blue-600 py-3 rounded-xl font-bold mt-4 shadow-lg hover:bg-blue-500 transition">CONFIRM PICKUP</button>`;
                } else if(o.status === 'Picked Up') {
                    actionBtn = `<button onclick="window.upd('${o.id}','Arrived')" class="w-full bg-purple-600 py-3 rounded-xl font-bold mt-4 shadow-lg hover:bg-purple-500 transition">I'VE ARRIVED</button>`;
                } else if(o.status === 'Arrived') {
                    actionBtn = `<button onclick="window.upd('${o.id}','Delivered')" class="w-full bg-green-500 py-3 rounded-xl font-bold mt-4 shadow-lg animate-pulse hover:bg-green-400">COLLECT ₹${o.total} & COMPLETE</button>`;
                }

                return `
                <div class="glass p-5 rounded-[1.5rem] relative slide-up mb-4 ${cardClass}">
                    <div class="flex justify-between items-start mb-3">
                         <div class="bg-slate-800 px-3 py-1 rounded-lg text-xs font-bold text-slate-300 border border-slate-600">Order #${o.id.substr(0,5)}</div>
                         <div class="text-xs font-bold text-green-400">Earn: ₹${o.deliveryFee}</div>
                    </div>

                    <div class="mb-4">
                        <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">${targetTitle}</p>
                        <h3 class="font-black text-white text-xl mb-1 flex items-center gap-2"><i class="fas ${icon} text-sm"></i> ${targetName}</h3>
                        <p class="text-sm text-slate-300 border-l-2 border-slate-500 pl-3 leading-snug">${targetAddr}</p>
                    </div>

                    <div class="flex gap-2 mb-3">
                        ${isPickupPhase ? '' : `<a href="tel:${o.customer.phone}" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 font-bold hover:bg-slate-700"><i class="fas fa-phone"></i> Call User</a>`}
                        ${locBadge}
                    </div>
                    
                    <a href="${mapUrl}" target="_blank" class="w-full bg-slate-800 border border-blue-500/30 text-blue-400 py-3 rounded-xl text-center text-sm font-bold flex items-center justify-center gap-2 hover:bg-slate-700 transition">
                        <i class="fas fa-location-arrow"></i> NAVIGATE TO ${isPickupPhase ? 'SHOP' : 'CUSTOMER'}
                    </a>

                    ${actionBtn}
                </div>`;
            }).join('');
        }

        // --- UPDATE STATUS FUNCTION ---
        window.upd = async (oid, status) => {
            if(status === 'Delivered') {
                if(!confirm("Confirm delivery and Cash Collection?")) return;
            }

            try {
                await updateDoc(doc(db, "orders", oid), { 
                    status: status,
                    timeline: arrayUnion({ status: status, msg: `Rider: ${status}`, time: new Date().toLocaleTimeString() }) 
                });
            } catch(e) {
                alert("Update Failed: " + e.message);
            }
        };

    </script>
</body>
</html>
