<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; padding-bottom: 20px; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="p-4">

    <div id="login" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-6">
        <div class="text-center w-full max-w-sm">
            <h2 class="text-3xl font-black mb-8 tracking-tighter">RIDER APP</h2>
            <input id="lPhone" type="number" placeholder="Mobile Number" class="w-full bg-slate-800 p-4 rounded-2xl mb-4 text-white font-bold outline-none border border-slate-700">
            <input id="lPass" type="password" placeholder="Password" class="w-full bg-slate-800 p-4 rounded-2xl mb-6 text-white font-bold outline-none border border-slate-700">
            <button id="loginBtn" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-black shadow-lg hover:scale-105 transition">START SHIFT</button>
        </div>
    </div>

    <div id="dash" class="hidden max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-bold leading-none" id="rName">Rider</h2>
            <button onclick="location.reload()" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-xl text-xs font-bold border border-red-500/20">LOGOUT</button>
        </div>

        <div class="glass p-6 rounded-[2rem] mb-6">
            <h1 class="text-5xl font-black text-white mb-2 tracking-tight" id="totalEarn">₹0</h1>
            <p class="text-xs text-slate-400 font-bold uppercase">Total Earnings (Delivered)</p>
        </div>

        <h3 class="font-bold text-slate-400 mb-4">Your Tasks</h3>
        <div id="taskList" class="space-y-5 pb-24"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc, onSnapshot, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwyzE9sdZZUU3dHUix23zEzFkGr2nNRyw",
            authDomain: "foodhub-8ae15.firebaseapp.com",
            projectId: "foodhub-8ae15",
            storageBucket: "foodhub-8ae15.firebasestorage.app",
            messagingSenderId: "274265160043",
            appId: "1:274265160043:web:81238fd424681e7f70342e",
            measurementId: "G-00YX8EM4L7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let me = null;

        document.getElementById('loginBtn').onclick = async () => {
            let p = document.getElementById('lPhone').value, pass = document.getElementById('lPass').value;
            const q = query(collection(db, "riders"), where("phone", "==", p), where("pass", "==", pass));
            const snap = await getDocs(q);
            
            if(!snap.empty) {
                me = { id: snap.docs[0].id, ...snap.docs[0].data() };
                document.getElementById('login').classList.add('hidden');
                document.getElementById('dash').classList.remove('hidden');
                document.getElementById('rName').innerText = me.name;
                startListening();
            } else alert("Invalid Login");
        };

        function startListening() {
            // Listen to orders assigned to this rider
            const q = query(collection(db, "orders"), where("riderPhone", "==", me.phone));
            onSnapshot(q, (snap) => {
                let orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTasks(orders);
            });
        }

        function renderTasks(orders) {
            // Filter active
            let active = orders.filter(o => o.status != 'Delivered' && o.status != 'Cancelled');
            let delivered = orders.filter(o => o.status == 'Delivered');

            // Calc Earnings
            let earn = delivered.reduce((sum, o) => sum + (parseInt(o.deliveryFee) || 0), 0);
            document.getElementById('totalEarn').innerText = `₹${earn}`;

            document.getElementById('taskList').innerHTML = active.map(o => {
                let mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.customer.addr)}`;
                let actionBtn = '';
                
                if(o.status == 'Out for Delivery') actionBtn = `<button onclick="window.upd('${o.id}','Picked Up')" class="w-full bg-blue-600 py-3 rounded-xl font-bold mt-4 shadow-lg">PICKUP ORDER</button>`;
                else if(o.status == 'Picked Up') actionBtn = `<button onclick="window.upd('${o.id}','Arrived')" class="w-full bg-purple-600 py-3 rounded-xl font-bold mt-4 shadow-lg">I'VE ARRIVED</button>`;
                else if(o.status == 'Arrived') actionBtn = `<button onclick="window.upd('${o.id}','Delivered')" class="w-full bg-green-500 py-3 rounded-xl font-bold mt-4 shadow-lg animate-pulse">COLLECT ₹${o.total} & DELIVER</button>`;

                return `
                <div class="glass p-5 rounded-[1.5rem] border border-slate-700 relative">
                    <div class="absolute top-0 right-0 bg-slate-800 px-4 py-1.5 rounded-bl-2xl text-[10px] font-bold text-orange-400">#${o.id.substr(0,5)}</div>
                    <h3 class="font-black text-white text-lg mb-1">${o.customer.name}</h3>
                    <p class="text-sm text-slate-300 mb-4">${o.customer.addr}</p>
                    <div class="grid grid-cols-2 gap-3">
                        <a href="tel:${o.customer.phone}" class="bg-slate-800 py-2.5 rounded-xl text-center text-xs font-bold">CALL</a>
                        <a href="${mapUrl}" target="_blank" class="bg-slate-800 py-2.5 rounded-xl text-center text-xs font-bold text-blue-400">MAP</a>
                    </div>
                    ${actionBtn}
                </div>`;
            }).join('') || '<div class="text-center opacity-50 mt-10">No active tasks</div>';
        }

        window.upd = async (oid, status) => {
            await updateDoc(doc(db, "orders", oid), { 
                status: status,
                timeline: arrayUnion({ status, msg: `Rider: ${status}`, time: new Date().toLocaleTimeString() }) 
            });
        };

    </script>
</body>
</html>
